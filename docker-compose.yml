version: '0.1'

services:
  mongodb:
    image: mongo:latest
    container_name: mongodb_nlp
    restart: always
    ports:
      - "27017:27017"
    volumes:
      - mongo_data:/data/db

  crawler:
    build: .
    container_name: news_crawler
    depends_on:
      - mongodb
    environment:
    - MONGO_URI=mongodb://mongodb:27017/
    - GEMINI_API_KEY=${MY_GEMINI_API_KEY}
    # - OPENAI_API_KEY=${MY_OPENAI_API_KEY}
    
volumes:
  mongo_data: