services:
  mongodb:
    image: mongo:latest
    container_name: mongodb_nlp
    restart: always
    ports:
      - "27017:27017"
    volumes:
      - mongo_data:/data/db

  crawler:
    build: .
    container_name: news_crawler
    depends_on:
      - mongodb
    environment:
    - MONGO_URI=mongodb://mongodb:27017/
    - GEMINI_API_KEY=AIzaSyDcDqXNIDH6wFIrh2d-Wh2OrN8vJzecxoQ
    
volumes:
  mongo_data: